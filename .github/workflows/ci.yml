name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - name: install tools
        run: |
          mkdir -p "$(go env GOPATH)/bin"
          curl -fsSL https://raw.githubusercontent.com/piusalfred/gotools/v0.6.7/gotools.sh \
            -o "$(go env GOPATH)/bin/gotools"
          chmod +x "$(go env GOPATH)/bin/gotools"
          gotools sync
      - name: lint
        run: gotools exec lint run
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -timeout 60s ./...
      - name: vulncheck
        run: gotools exec vulncheck ./...
      - name: mdlint
        run: gotools exec mdlint $(find . -name "*.md" -not -path "./tools/*")
