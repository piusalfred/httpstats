name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install tools
        run: |
          go install github.com/piusalfred/gotools/cmd/gotools@v0.7.1
          gotools sync
      - name: lint
        run: gotools exec lint run
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 -timeout 60s ./...
      - name: vulncheck
        run: gotools exec vulncheck ./...
      - name: mdlint
        run: gotools exec mdlint $(find . -name "*.md" -not -path "./tools/*")
