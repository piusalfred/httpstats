pre-commit:
  commands:
    fmt:
      glob: "*.go"
      run: gotools exec lint fmt ./...
      stage_fixed: true
    yamlfmt:
      glob: "*.{yml,yaml}"
      run: gotools exec yamlfmt {staged_files}
      stage_fixed: true
    check:
      glob: "*.{go,md}"
      run: gotools exec lint run ./... && go vet ./... && gotools exec mdlint {staged_files}
    test:
      glob: "*.go"
      run: go test -race -count=1 -timeout 30s ./...
